
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(2e3440)
}

label {
    monitor =
    text = $TIME
    color = rgb(88c0d0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(88c0d0)
    inner_color = rgb(3b4252)
    font_color = rgb(eceff4)
    check_color = rgb(a3be8c)
    fail_color = rgb(bf616a)

    placeholder_text = Password...
    fade_on_empty = false

    position = 0, -80
    halign = center
    valign = center
}

